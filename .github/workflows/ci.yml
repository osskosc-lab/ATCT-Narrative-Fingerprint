name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          atct-fingerprint analyze examples/sample_ja.txt \
            --shuffles 8 \
            --output reports/smoke
          test -s reports/smoke/fingerprint.json
          test -s reports/smoke/sentence_map.csv
          test -s reports/smoke/report.pdf
